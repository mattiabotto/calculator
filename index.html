<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./scripts/script.js" defer></script>
  <link href="./styles/styles.css" rel="stylesheet">
  <title>Calculator</title>
</head>
<body>
  <main class="calculator">
    <div class="display dark">
      <div class="operation"></div>
      <div class="current">0</div>
    </div>

    <div class="buttons-container">
      <button class="dark">CE</button>
      <button class="dark">C</button>
      <button class="backspace dark">
        <span class="hidden">Backspace</span>
        <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
      </button>
      <button class="dark">/</button>

      <button class="light">7</button>
      <button class="light">8</button>
      <button class="light">9</button>
      <button class="dark"><span class="bigger">x</span></button>

      <button class="light">4</button>
      <button class="light">5</button>
      <button class="light">6</button>
      <button class="dark"><span class="minus">-</span></button>

      <button class="light">1</button>
      <button class="light">2</button>
      <button class="light">3</button>
      <button class="dark"><span class="bigger">+</span></button>

      <button class="light">+/-</button>
      <button class="light">0</button>
      <button class="light">.</button>
      <button class="orange"><span class="bigger">=</span></button>
    </button>
  </main>
</body>
</html>
