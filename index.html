<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./scripts/script.js" defer></script>
  <link href="./styles/styles.css" rel="stylesheet">
  <title>Calculator</title>
</head>
<body>
  <main class="calculator">
    <div class="display dark">999</div>
    <div class="buttons-container">
      <div class="dark">C</div>
      <div class="dark">CE</div>
      <div class="backspace dark">
        <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
      </div>
      <div class="dark">/</div>
      <div class="light">7</div>
      <div class="light">8</div>
      <div class="light">9</div>
      <div class="dark"><span class="bigger">x</span></div>
      <div class="light">4</div>
      <div class="light">5</div>
      <div class="light">6</div>
      <div class="dark"><span class="minus">-</span></div>
      <div class="light">1</div>
      <div class="light">2</div>
      <div class="light">3</div>
      <div class="dark"><span class="bigger">+</span></div>
      <div class="light">+/-</div>
      <div class="light">0</div>
      <div class="light">.</div>
      <div class="orange"><span class="bigger">=</span></div>
    </div>
  </main>
</body>
</html>
